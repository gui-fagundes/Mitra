# CI a cada push e pull request (RNF-MA-03) e deploy no servidor quando a main passa.
#
# Deploy automático: desligue criando a variável DEPLOY_AUTOMATICO=false em
# Settings → Secrets and variables → Actions → Variables (ex.: durante o teste de
# usabilidade). O deploy manual (aba Actions → "Run workflow") continua disponível.
name: CI e deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Em PR, um push novo cancela a verificação anterior; na main nunca (não interrompe um deploy).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (lint e testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mitra
          POSTGRES_PASSWORD: mitra
          POSTGRES_DB: mitra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mitra" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mitra:mitra@localhost:5432/mitra
      TEST_DATABASE_URL: postgresql://mitra:mitra@localhost:5432/mitra_teste
      TOKEN_SECRET_KEY: chave-so-para-o-ci
      TOKEN_ALGORITHM: HS256
      # Chave Fernet só de teste (sem valor fora do CI).
      ENCRYPTION_KEY: nxn7WcQHl4ZmbtZKdgEpXa_y8zDOeEZjkhr_cjju2iA=
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Banco de teste
        run: PGPASSWORD=mitra psql -h localhost -U mitra -d mitra -c "CREATE DATABASE mitra_teste"
      - name: Dependências
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Migrações batem com os modelos
        run: uv run alembic upgrade head && uv run alembic check
      - name: Testes com cobertura
        run: uv run pytest -q --cov --cov-report=term

  frontend:
    name: Frontend (tipos e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  deploy:
    name: Deploy no servidor
    needs: [backend, frontend]
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && vars.DEPLOY_AUTOMATICO != 'false')
      )
    runs-on: ubuntu-latest
    environment: producao
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    steps:
      - name: Chave e servidor conhecido
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Atualizar
        # No servidor, essa chave só consegue rodar deploy/atualizar.sh (ver deploy/README.md).
        run: ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes root@${{ secrets.DEPLOY_HOST }}
