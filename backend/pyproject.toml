[project]
name = "backend"
version = "0.1.0"
description = "Backend Mitra (FastAPI + SQLAlchemy)"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.19.1",
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "bcrypt>=4.2.0",
    "psycopg[binary]>=3.2.0",
    "pydantic[email]>=2.13.4",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
dev = "app.cli:dev"
producao = "app.cli:producao"
migrar = "app.cli:migrar"
reverter = "app.cli:reverter"
criar-migracao = "app.cli:criar_migracao"
expurgar-registros = "app.cli:expurgar_registros"
testar = "app.cli:testar"
cobertura = "app.cli:cobertura"
verificar = "app.cli:verificar"
formatar = "app.cli:formatar"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-length já cobre
    "B008",  # Depends()/Query()/etc no default é idiomático do FastAPI
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true          # mede também os dois lados de cada if, não só as linhas
omit = ["app/cli.py"]  # comandos de terminal, fora da API

[tool.coverage.report]
show_missing = true    # mostra as linhas não cobertas
skip_covered = true    # esconde os arquivos com 100%
exclude_also = ["if TYPE_CHECKING:"]
